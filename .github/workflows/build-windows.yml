name: Build Preventivi Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: bash
        run: |
          set -e
          if [ -f "pubspec.yaml" ]; then
            APP_DIR="."
          else
            APP_DIR="$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit | xargs -r dirname)"
          fi
          if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/pubspec.yaml" ]; then
            echo "Errore: pubspec.yaml non trovato" >&2
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean Old Windows Project Files
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          rm -rf windows
          rm -rf build

      - name: Re-create Windows Project Configuration
        working-directory: ${{ env.APP_DIR }}
        run: flutter create --platforms=windows --project-name preventivi_app .

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        run: flutter build windows --release

      - name: Compress Release Output
        shell: pwsh
        run: |
          $buildDir = "${{ env.APP_DIR }}/build/windows/x64/runner/Release"
          Compress-Archive -Path "$buildDir\*" -DestinationPath "Preventivi-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows-x64
          path: Preventivi-Windows-x64.zip
          if-no-files-found: error
