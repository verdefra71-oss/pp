name: Build Preventivi Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Gestione Preventivi for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Enable Windows support and create platform files
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Set Windows application icon
        shell: pwsh
        run: |
          $icon = "assets/app_icon.ico"
          $dest = "windows/runner/resources/app_icon.ico"

          if (!(Test-Path $icon)) {
            throw "Icona non trovata: $icon"
          }

          Copy-Item $icon $dest -Force

      - name: Set Windows application name
        shell: pwsh
        run: |
          $rc = "windows/runner/Runner.rc"

          if (Test-Path $rc) {
            $s = Get-Content $rc -Raw
            $s = $s -replace 'VALUE "FileDescription", ".*?"', 'VALUE "FileDescription", "Gestione Preventivi - Il Tornitore"'
            $s = $s -replace 'VALUE "ProductName", ".*?"', 'VALUE "ProductName", "Gestione Preventivi - Il Tornitore"'
            Set-Content $rc $s -Encoding UTF8
          }

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Compress Windows release
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "Gestione-Preventivi-Il-Tornitore-Windows-x64.zip" `
            -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-Il-Tornitore-Windows-x64
          path: Gestione-Preventivi-Il-Tornitore-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
