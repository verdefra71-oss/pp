name: Build Preventivi Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path "pubspec.yaml") {
            $appDir = "."
          } else {
            $pubspec = Get-ChildItem -Path . -Filter pubspec.yaml -Recurse -File |
              Where-Object { $_.FullName -notmatch '\\.dart_tool\\' } |
              Select-Object -First 1
            if (-not $pubspec) {
              Write-Error "Errore: pubspec.yaml non trovato"
              exit 1
            }
            $appDir = $pubspec.Directory.FullName
          }
          "APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Progetto Flutter: $appDir"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter doctor -v
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            Write-Error "CMake non disponibile nel runner Windows"
            exit 1
          }

      - name: Prepare Flutter Windows project
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter create --platforms=windows --project-name preventivi_app .
          if (-not (Test-Path "windows/CMakeLists.txt")) {
            Write-Error "Progetto Windows Flutter non generato correttamente"
            exit 1
          }

      - name: Check Flutter notification plugin version
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          flutter pub deps --style=compact | Select-String "flutter_local_notifications"

      - name: Clean Flutter build
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter clean
          flutter pub get

      - name: Analyze project
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter analyze --no-fatal-infos

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release

      - name: Verify Windows output
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:APP_DIR "build/windows/x64/runner/Release"
          $exe = Join-Path $release "preventivi_app.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "preventivi_app.exe non trovato in $release"
            Get-ChildItem -Path "build/windows" -Recurse -File | Select-Object -First 100 FullName
            exit 1
          }
          Write-Host "Build Windows completata: $exe"
          Get-ChildItem $release -Recurse | Select-Object FullName, Length

      - name: Create Windows ZIP
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:APP_DIR "build/windows/x64/runner/Release"
          $zip = Join-Path $env:APP_DIR "build/Preventivi-Windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$release\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Archivio creato: $zip"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows
          path: ${{ env.APP_DIR }}/build/Preventivi-Windows.zip
          if-no-files-found: error

      - name: Upload Windows release folder
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows-Release
          path: ${{ env.APP_DIR }}/build/windows/x64/runner/Release/**
          if-no-files-found: error
