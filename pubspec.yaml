name: preventivi_app
description: "Applicazione di gestione e generazione preventivi per Windows, Android e iOS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database SQLite (con supporto FFI per Windows)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+1

  # Utilità generali e filesystem
  path: ^1.8.3
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  share_plus: ^8.0.0
  intl: ^0.19.0

  # PDF e Stampa
  pdf: ^3.10.8
  printing: ^5.11.1

  # Notifiche locali
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
